<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="logoGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3F51B5;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="60" cy="60" r="55" fill="url(#logoGradient)" />
  
  <!-- AI Brain Circuit Design - matching the exact image -->
  <g fill="white" opacity="0.9" stroke="white" stroke-width="1.5">
    <!-- Main brain outline -->
    <path d="M35 50 Q35 35 45 30 Q55 25 60 30 Q65 25 75 30 Q85 35 85 50 Q85 60 80 65 Q85 70 85 80 Q85 90 75 85 Q65 90 60 85 Q55 90 45 85 Q35 90 35 80 Q35 70 40 65 Q35 60 35 50 Z" fill="none" stroke-width="2"/>
    
    <!-- Circuit elements inside brain -->
    <g stroke-width="1.2">
      <!-- Central processing unit -->
      <rect x="55" y="48" width="10" height="8" rx="2" fill="white"/>
      <rect x="57" y="50" width="6" height="4" rx="1" fill="#2196F3"/>
      
      <!-- Left side circuits -->
      <circle cx="45" cy="45" r="2.5" fill="white"/>
      <circle cx="42" cy="55" r="2" fill="white"/>
      <circle cx="45" cy="65" r="2.5" fill="white"/>
      <circle cx="48" cy="75" r="2" fill="white"/>
      
      <!-- Right side circuits -->
      <circle cx="75" cy="45" r="2.5" fill="white"/>
      <circle cx="78" cy="55" r="2" fill="white"/>
      <circle cx="75" cy="65" r="2.5" fill="white"/>
      <circle cx="72" cy="75" r="2" fill="white"/>
      
      <!-- Connection lines -->
      <line x1="55" y1="52" x2="47.5" y2="45"/>
      <line x1="55" y1="52" x2="44" y2="55"/>
      <line x1="55" y1="52" x2="47.5" y2="65"/>
      <line x1="65" y1="52" x2="72.5" y2="45"/>
      <line x1="65" y1="52" x2="76" y2="55"/>
      <line x1="65" y1="52" x2="72.5" y2="65"/>
      
      <!-- Additional circuit paths -->
      <line x1="45" y1="65" x2="48" y2="75"/>
      <line x1="75" y1="65" x2="72" y2="75"/>
      
      <!-- Small circuit components -->
      <rect x="40" y="48" width="6" height="3" rx="1" fill="white"/>
      <rect x="74" y="48" width="6" height="3" rx="1" fill="white"/>
      <rect x="46" y="38" width="4" height="6" rx="1" fill="white"/>
      <rect x="70" y="38" width="4" height="6" rx="1" fill="white"/>
      
      <!-- Bottom connector -->
      <rect x="57" y="78" width="6" height="8" rx="2" fill="white"/>
      <rect x="58" y="80" width="4" height="4" rx="1" fill="#2196F3"/>
    </g>
  </g>
  
  <!-- ALLIANCE AI Text -->
  <text x="60" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5px">
    ALLIANCE AI
  </text>
</svg>
